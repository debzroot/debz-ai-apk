name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Buat GitHub Release dari hasil build (mis. rootfs-mini-v1). Kosongkan = artefak saja."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Inject opencode session (opsional, per-device auto)
        run: |
          if [ -n "${{ secrets.OPENCODE_SESSION_ID }}" ]; then
            sed -i "s|__OPENCODE_SESSION_ID__|${{ secrets.OPENCODE_SESSION_ID }}|g" backend/.ai-providers.json
            echo "session injected dari secret"
          else
            # MULTI-USER: secret opsional. Placeholder dibiarkan — backend
            # providers_autofix_sid() generate UUID per-HP saat first boot,
            # jadi tiap user dapat session unik, anti 401 massal.
            echo "::warning::Secret OPENCODE_SESSION_ID kosong — lanjut tanpa inject (auto-generate per-device aktif)."
          fi
          php -r '$d=json_decode(file_get_contents("backend/.ai-providers.json"),true); exit(isset($d["providers"]["debz"])?0:1);' \
            && echo "providers JSON OK"

      - name: Build rootfs-mini
        run: bash rootfs/build-rootfs.sh
        env:
          WORK: ${{ github.workspace }}/.work-rootfs
          OUT: ${{ github.workspace }}/out

      # Artefak Actions kuotanya kecil & recalc 6-12 jam — handoff antar job
      # + distribusi APK lewat Release rolling ci-latest (overwrite tiap run).
      - name: Upload tarball ke Release ci-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ci-latest >/dev/null 2>&1 || gh release create ci-latest \
            --title "CI latest (rolling)" \
            --notes "Build otomatis tiap push main. Asset di-overwrite tiap run sukses." \
            --prerelease
          gh release upload ci-latest --clobber out/rootfs-mini.tar.gz out/SHA256SUMS

      - name: GitHub Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            --title "${{ inputs.release_tag }}" \
            --notes "rootfs-mini arm64: ubuntu-base 24.04 + php-fpm/nginx/python3 + opencode ${OPENCODE_VER:-} + debz-ai backend + wheels offline" \
            out/rootfs-mini.tar.gz out/SHA256SUMS

  android:
    needs: rootfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch proot arm64 (jniLibs)
        run: |
          # retry+timeout: tanpa ini flake jaringan = build merah/hang.
          CURL="curl -sSL --retry 3 --retry-all-errors --retry-delay 3 --connect-timeout 30 --max-time 300"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets
          pkg_url() {
            $CURL https://packages.termux.org/apt/termux-main/dists/stable/main/binary-aarch64/Packages \
              | awk -v p="$1" '/^Package: /{f=($2==p)} f && /^Filename: /{print "https://packages.termux.org/apt/termux-main/"$2; exit}'
          }
          PROOT_URL=$(pkg_url "proot")
          [ -n "$PROOT_URL" ] || { echo "::error::proot tidak ketemu di Packages index"; exit 1; }
          echo "proot -> $PROOT_URL"
          $CURL -o /tmp/proot.deb "$PROOT_URL"
          dpkg-deb -x /tmp/proot.deb /tmp/proot-ex
          cp /tmp/proot-ex/data/data/com.termux/files/usr/bin/proot app/src/main/jniLibs/arm64-v8a/libproot.so
          fetch_lib() {
            local names="$1" glob="$2" n url
            for n in ${names//,/ }; do
              url=$(pkg_url "$n")
              [ -n "$url" ] && break
            done
            [ -n "$url" ] || { echo "::error::$1 tidak ketemu di Packages index"; exit 1; }
            echo "lib $n -> $url"
            rm -rf /tmp/lib-ex && mkdir -p /tmp/lib-ex
            $CURL -o /tmp/lib.deb "$url"
            dpkg-deb -x /tmp/lib.deb /tmp/lib-ex
            cp /tmp/lib-ex/data/data/com.termux/files/usr/lib/$glob app/src/main/assets/
          }
          fetch_lib "libtalloc" "libtalloc.so.*"
          fetch_lib "libandroid-shmem" "libandroid-shmem.so*"
          fetch_lib "libtermux-exec,termux-exec" "libtermux-exec.so*"
          # proot Termux butuh loader eksternal (bukan bundled): default-nya
          # di path Termux (/data/data/com.termux/.../loader) yang tak ada
          # di HP user -> execve selalu ENOENT. Bawa loader+loader32 di
          # assets, app set PROOT_LOADER saat exec.
          cp /tmp/proot-ex/data/data/com.termux/files/usr/libexec/proot/loader app/src/main/assets/loader
          cp /tmp/proot-ex/data/data/com.termux/files/usr/libexec/proot/loader32 app/src/main/assets/loader32
          chmod +x app/src/main/assets/loader app/src/main/assets/loader32
          ls app/src/main/assets/ | grep -E 'loader' || { echo "::error::loader proot tidak kebawa"; exit 1; }
          ls app/src/main/assets/ | grep -E '\.so' || { echo "::error::tidak ada .so kebawa"; exit 1; }
          readelf -d app/src/main/jniLibs/arm64-v8a/libproot.so | grep NEEDED || true
          chmod +x app/src/main/jniLibs/arm64-v8a/libproot.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Bundle rootfs-mini ke assets (install langsung jalan)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets
          gh release download ci-latest -p 'rootfs-mini.tar.gz' -p 'SHA256SUMS' \
            -D app/src/main/assets/ --clobber
          ls -la app/src/main/assets/rootfs-mini.tar.gz app/src/main/assets/SHA256SUMS

      - name: Cek assets
        run: ls -la app/src/main/assets/

      - name: Siapkan signing key (dari secret, jangan pernah commit)
        env:
          DEBZ_KEYSTORE: ${{ secrets.DEBZ_KEYSTORE_B64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -z "$DEBZ_KEYSTORE" ]; then
            echo "::warning::Secret DEBZ_KEYSTORE_B64 kosong — APK akan fallback ke debug key (upgrade next build jadi uninstall)"
          else
            printf '%s' "$DEBZ_KEYSTORE" | base64 -d > "$RUNNER_TEMP/keys/debz.jks"
            echo "KEYSTORE=$RUNNER_TEMP/keys/debz.jks" >> "$GITHUB_ENV"
          fi

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7

      - name: Build release APK
        env:
          GRADLE_OPTS: -Xmx4g -Dfile.encoding=UTF-8
          DEBZ_KEYSTORE_PASSWORD: ${{ secrets.DEBZ_KEYSTORE_PASSWORD }}
          DEBZ_KEY_ALIAS: ${{ secrets.DEBZ_KEY_ALIAS }}
          APK_VNAME: 0.2.0-r${{ github.run_number }}
          APK_VCODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon --max-workers=1

      - name: Upload APK ke Release ci-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -la "$APK"
          gh release upload ci-latest --clobber "$APK"
