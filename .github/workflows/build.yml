name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Buat GitHub Release dari hasil build (mis. rootfs-mini-v1). Kosongkan = artefak saja."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Inject opencode session (tanpa API key)
        run: |
          if [ -n "${{ secrets.OPENCODE_SESSION_ID }}" ]; then
            sed -i "s|__OPENCODE_SESSION_ID__|${{ secrets.OPENCODE_SESSION_ID }}|g" backend/.ai-providers.json
            echo "session injected"
          else
            echo "::warning::Secret OPENCODE_SESSION_ID kosong — chat bakal 401. Isi di Settings → Secrets."
          fi
          php -r '$d=json_decode(file_get_contents("backend/.ai-providers.json"),true); exit(isset($d["providers"]["debz"])?0:1);' \
            && echo "providers JSON OK"

      - name: Build rootfs-mini
        run: bash rootfs/build-rootfs.sh
        env:
          WORK: ${{ github.workspace }}/.work-rootfs
          OUT: ${{ github.workspace }}/out

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: rootfs-mini
          path: |
            out/rootfs-mini.tar.gz
            out/SHA256SUMS

      - name: GitHub Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ inputs.release_tag }}" \
            --title "${{ inputs.release_tag }}" \
            --notes "rootfs-mini arm64: ubuntu-base 24.04 + php-fpm/nginx/python3 + opencode ${OPENCODE_VER:-} + debz-ai backend + wheels offline" \
            out/rootfs-mini.tar.gz out/SHA256SUMS

  android:
    needs: rootfs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Fetch proot arm64 (jniLibs)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -sSL -o /tmp/proot.deb https://packages.termux.org/apt/termux-main/pool/main/p/proot/proot_5.1.107.95_aarch64.deb
          dpkg-deb -x /tmp/proot.deb /tmp/proot-ex
          cp /tmp/proot-ex/data/data/com.termux/files/usr/bin/proot app/src/main/jniLibs/arm64-v8a/libproot.so
          chmod +x app/src/main/jniLibs/arm64-v8a/libproot.so
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Bundle rootfs-mini ke assets (install langsung jalan)
        uses: actions/download-artifact@v4
        with:
          name: rootfs-mini
          path: app/src/main/assets/

      - name: Cek assets
        run: ls -la app/src/main/assets/

      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debz-ai-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
