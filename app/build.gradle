plugins {
    id("com.android.application")
}

// Signing key: prioritas secret CI (DEBZ_KEYSTORE path + password + alias).
// Tanpa secret -> keystore fallback yang di-cache antar run CI (lihat
// workflow "Siapkan signing key") + password/alias default di bawah.
// JANGAN fallback ke debug key runner: debug key ganti tiap build ->
// INSTALL_FAILED_UPDATE_INCOMPATIBLE -> user dipaksa uninstall (= data
// workspace hilang). Tanda tangan harus stabil antar build.
def keystoreFile = System.getenv("DEBZ_KEYSTORE")
def _envPass = System.getenv("DEBZ_KEYSTORE_PASSWORD")
def _envAlias = System.getenv("DEBZ_KEY_ALIAS")
// trim: workflow selalu export var (kosong kalau secret unset); string kosong
// harus jatuh ke default, bukan jadi password "".
def keystorePass = (_envPass != null && !_envPass.trim().isEmpty()) ? _envPass : "debz-fallback-2026"
def keystoreAlias = (_envAlias != null && !_envAlias.trim().isEmpty()) ? _envAlias : "debz"

android {
    namespace = "ai.debz"
    compileSdk = 34

    defaultConfig {
        applicationId = "ai.debz"
        minSdk = 26
        // JANGAN naikkan ke 29+: targetSdk 29+ = domain untrusted_app
        // TANPA execute ke app_data_file (W^X, dontaudit-silent) ->
        // execve loader proot + semua binary rootfs EACCES -> stack-fail
        // abadi tiap boot (verified di HP Infinix X6725C, 2026-10-01:
        // untrusted_app cuma {read map open...}, tanpa execute;
        // untrusted_app_27 (targetSdk 26-28) masih boleh execute).
        // 28 = batas atas yang aman, sama kayak Termux. compileSdk tetap 34.
        targetSdk = 28
        // CI isi via env biar tiap build keidentifikasi (sidebar device
        // info + cegah salah-install artefak lawas). Default = dev lokal.
        versionCode = (System.getenv("APK_VCODE") ?: "2").toInteger()
        versionName = System.getenv("APK_VNAME") ?: "0.2.0-run"
    }

    // rootfs-mini.tar.gz dibundle di assets — jangan dikompres ulang
    aaptOptions {
        noCompress "tar.gz"
    }

    signingConfigs {
        if (keystoreFile && file(keystoreFile).exists()) {
            create("release") {
                storeFile = file(keystoreFile)
                storePassword = keystorePass
                keyAlias = keystoreAlias
                keyPassword = keystorePass
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            // keystore fallback wajib ada (repo/CI sediakan); debug key
            // runner dilarang karena tanda tangan berubah tiap build.
            signingConfig = (keystoreFile && file(keystoreFile).exists())
                ? signingConfigs.getByName("release")
                : signingConfigs.getByName("debug")
        }
        // tanpa applicationIdSuffix: debug & release sama-sama ai.debz,
        // jadi ga ada app kembar yang diam-diam nyisa data pas uninstall
        debug {
            minifyEnabled = false
        }
    }

    // Sideload-only, BUKAN Google Play: targetSdk 28 disengaja (hak exec
    // SELinux, lihat komen di defaultConfig). Aturan Play
    // ExpiredTargetSdkVersion dimatikan; vital check lain tetap jalan.
    lint {
        disable += "ExpiredTargetSdkVersion"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    implementation("org.apache.commons:commons-compress:1.26.0")
}
