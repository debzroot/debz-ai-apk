; pool php-fpm debz-ai. proot jalan -0 (fake root) tapi FPM nolak
; pool user=root -> pakai www-data (ada di ubuntu-base, uid 33).
; setuid di-fake proot, file access pakai uid app asli (o+r cukup).
[debz]
listen = 127.0.0.1:@FPM@
listen.allowed_clients = 127.0.0.1
user = www-data
group = www-data
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
php_admin_value[error_log] = /opt/debz/logs/php-fpm.log
php_admin_flag[log_errors] = on
; Default PHP = 2M/file & 8M/post -> foto HP langsung ditolak sebelum
; debz_chat_images_save() (yang nolak di 20MB) pernah jalan. Samain.
php_admin_value[upload_max_filesize] = 20M
php_admin_value[post_max_size] = 64M
php_admin_value[max_file_uploads] = 12
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 0
php_admin_value[default_socket_timeout] = 3600
; Buffer 0 = FPM gak ngebut buffering output; kalau ngebut, flush() ke
; nginx emang terkirim tapi data nyangkut di buffer FPM -> SSE "melar".
php_admin_value[output_buffering] = 0
php_admin_value[zlib.output_compression] = 0
